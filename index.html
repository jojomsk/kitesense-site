<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email подтверждён — KiteSense</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #F5F5F5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #1C1C1E;
        }
        .card {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 40px 32px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        .icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 24px;
            margin: 0 0 12px 0;
            color: #0A84FF;
        }
        p {
            font-size: 16px;
            color: #8E8E93;
            line-height: 1.5;
            margin: 0 0 8px 0;
        }
        .hint {
            font-size: 14px;
            color: #8E8E93;
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✅</div>
        <h1>Email подтверждён!</h1>
        <p>Твой аккаунт KiteSense активирован.</p>
        <p>Вернись в приложение и войди с тем же email и паролем.</p>
        <p class="hint">Если приложение ещё не установлено — скачай его и войди.</p>
    </div>
</body>
</html>
