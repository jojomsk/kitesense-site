<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сброс пароля — KiteSense</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
               background: #f5f5f7; display: flex; justify-content: center;
               align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: white; border-radius: 20px; padding: 40px 24px;
                max-width: 400px; width: 100%; text-align: center;
                box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
        h1 { color: #1c1c1e; font-size: 24px; margin: 0 0 12px; }
        p { color: #6e6e73; font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
        .btn { display: inline-block; background: #0a84ff; color: white;
               text-decoration: none; padding: 16px 32px; border-radius: 12px;
               font-weight: 600; font-size: 16px; border: none; cursor: pointer;
               transition: background 0.2s; }
        .btn:hover { background: #0066cc; }
        .icon { font-size: 56px; margin-bottom: 16px; }
        .error { color: #ff3b30; font-size: 14px; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🔐</div>
        <h1>Сброс пароля</h1>
        <p>Нажми кнопку ниже, чтобы сбросить пароль от KiteSense.</p>
        <button class="btn" id="resetBtn">Сбросить пароль</button>
        <div class="error" id="errorMsg" style="display:none;"></div>
    </div>

    <script>
        document.getElementById('resetBtn').addEventListener('click', function() {
            const params = new URLSearchParams(window.location.search);
            const tokenHash = params.get('token_hash');
            const type = params.get('type') || 'recovery';
            const redirectTo = params.get('redirect_to') || 'https://kitesense.ru';

            if (!tokenHash) {
                const err = document.getElementById('errorMsg');
                err.textContent = 'Ссылка повреждена. Запроси сброс заново.';
                err.style.display = 'block';
                return;
            }

            const url = 'https://akugwjdpifenvzirjsqi.supabase.co/auth/v1/verify?'
                + 'token_hash=' + encodeURIComponent(tokenHash)
                + '&type=' + encodeURIComponent(type)
                + '&redirect_to=' + encodeURIComponent(redirectTo);

            window.location.href = url;
        });
    </script>
</body>
</html>
